{{- $debugValues := (index .Values "debug") | default dict -}}
{{- $debugEnabled := index $debugValues "enabled" -}}
{{- $debugContinueValue := index $debugValues "continue" -}}
{{- $debugContinue := ternary true $debugContinueValue (eq $debugContinueValue nil) -}}
{{- $debugFSGroupValue := index $debugValues "fsGroup" -}}
{{- $debugFSGroup := ternary "auto" $debugFSGroupValue (eq $debugFSGroupValue nil) -}}
{{- $debugImage := (index $debugValues "image") | default "ghcr.io/osac-project/osac-operator:latest-debug" -}}
{{- $debugImagePullPolicy := (index $debugValues "imagePullPolicy") | default "IfNotPresent" -}}
{{- $debugResources := (index $debugValues "resources") | default (dict "limits" (dict "cpu" "1" "memory" "1Gi") "requests" (dict "cpu" "100m" "memory" "256Mi")) -}}
{{- $rolloutToken := index $debugValues "rolloutToken" -}}
{{- if and $debugEnabled (not .Values.serviceAccount.create) -}}
{{- fail "debug.enabled requires serviceAccount.create=true so the debug SCC can be scoped to a dedicated service account" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osac-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "osac-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{ if $rolloutToken }}
        kubectl.kubernetes.io/restartedAt: {{ $rolloutToken | quote }}
        {{ end }}
      labels:
        {{- include "osac-operator.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          {{- if $debugEnabled }}
          type: Unconfined
          {{- else }}
          type: RuntimeDefault
          {{- end }}
        {{- if and $debugEnabled (ne (toString $debugFSGroup) "auto") }}
        fsGroup: {{ $debugFSGroup }}
        {{- end }}
      containers:
      - name: manager
        {{- if $debugEnabled }}
        command:
        - /usr/local/bin/debug-entrypoint
        {{- else }}
        command:
        - /usr/local/bin/manager
        {{- end }}
        args:
          - --leader-elect={{ not $debugEnabled }}
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
          - --fulfillment-ca-file=/etc/ca-bundle/bundle.pem
        {{- if $debugEnabled }}
        image: {{ $debugImage | quote }}
        imagePullPolicy: {{ $debugImagePullPolicy }}
        ports:
        - name: debugger
          containerPort: 2345
          protocol: TCP
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- end }}
        envFrom:
          - secretRef:
              name: {{ .Values.configSecret.name }}
              optional: {{ .Values.configSecret.optional }}
        env:
          {{- if $debugEnabled }}
          - name: OSAC_DEBUG_CONTINUE
            value: {{ $debugContinue | quote }}
          - name: HOME
            value: /tmp
          - name: TMPDIR
            value: /tmp
          {{- end }}
          - name: OSAC_AAP_URL
            value: {{ .Values.aap.url | default "http://osac-aap/api/controller" | quote }}
          {{- if and .Values.aap.tokenSecret .Values.aap.tokenSecret.name }}
          - name: OSAC_AAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.aap.tokenSecret.name }}
                key: {{ .Values.aap.tokenSecret.key | default "token" }}
                optional: true
          {{- else if .Values.aap.token }}
          - name: OSAC_AAP_TOKEN
            value: {{ .Values.aap.token | quote }}
          {{- end }}
          {{- if .Values.aap.insecureSkipVerify }}
          - name: OSAC_AAP_INSECURE_SKIP_VERIFY
            value: {{ .Values.aap.insecureSkipVerify | quote }}
          {{- end }}
          {{- if .Values.aap.statusPollInterval }}
          - name: OSAC_AAP_STATUS_POLL_INTERVAL
            value: {{ .Values.aap.statusPollInterval | quote }}
          {{- end }}
          {{- if .Values.aap.templatePrefix }}
          - name: OSAC_AAP_TEMPLATE_PREFIX
            value: {{ .Values.aap.templatePrefix | quote }}
          {{- end }}
          {{- if .Values.stall.preparingInfrastructureThreshold }}
          - name: OSAC_CLUSTER_PREPARING_INFRASTRUCTURE_STALL_THRESHOLD
            value: {{ .Values.stall.preparingInfrastructureThreshold | quote }}
          {{- end }}
          {{- if .Values.stall.controlPlaneStartingThreshold }}
          - name: OSAC_CLUSTER_CONTROL_PLANE_STARTING_STALL_THRESHOLD
            value: {{ .Values.stall.controlPlaneStartingThreshold | quote }}
          {{- end }}
          {{- if .Values.stall.workersJoiningThreshold }}
          - name: OSAC_CLUSTER_WORKERS_JOINING_STALL_THRESHOLD
            value: {{ .Values.stall.workersJoiningThreshold | quote }}
          {{- end }}
          {{- if .Values.stall.workersJoiningByInstanceType }}
          - name: OSAC_CLUSTER_WORKERS_JOINING_STALL_THRESHOLD_OVERRIDES
            value: {{ .Values.stall.workersJoiningByInstanceType | toJson | quote }}
          {{- end }}
          {{- if .Values.networkManagers.capabilitiesSyncInterval }}
          - name: OSAC_NETWORK_CLASS_SYNC_INTERVAL
            value: {{ .Values.networkManagers.capabilitiesSyncInterval | quote }}
          {{- end }}
          {{- if .Values.fulfillment.serverAddress }}
          - name: OSAC_FULFILLMENT_SERVER_ADDRESS
            value: {{ .Values.fulfillment.serverAddress | quote }}
          - name: OSAC_FULFILLMENT_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.fulfillment.credentials.secretName | required "fulfillment.credentials.secretName is required" }}
                key: {{ .Values.fulfillment.credentials.clientIdKey | required "fulfillment.credentials.clientIdKey is required" }}
          - name: OSAC_FULFILLMENT_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.fulfillment.credentials.secretName | required "fulfillment.credentials.secretName is required" }}
                key: {{ .Values.fulfillment.credentials.clientSecretKey | required "fulfillment.credentials.clientSecretKey is required" }}
          {{- end }}
          {{- if .Values.fulfillment.configMap.name }}
          - name: OSAC_FULFILLMENT_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.fulfillment.configMap.name }}
                key: OSAC_FULFILLMENT_ENDPOINT
                optional: true
          - name: OSAC_FULFILLMENT_ISSUER_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.fulfillment.configMap.name }}
                key: OSAC_FULFILLMENT_ISSUER_URL
                optional: {{ .Values.fulfillment.configMap.optional }}
          {{- end }}
          {{- if .Values.ignition.trustIngressCA }}
          - name: OSAC_IGNITION_TRUST_INGRESS_CA
            value: "true"
          {{- end }}
          - name: OSAC_CLUSTER_ORDER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_COMPUTE_INSTANCE_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_TENANT_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_NETWORKING_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_BARE_METAL_INSTANCE_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_STORAGE_CONFIG_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_VOLUME_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OSAC_ENABLE_CLUSTER_CONTROLLER
            value: {{ include "osac-operator.controllerEnabled" (list . "clusterOrder" "caas") | quote }}
          - name: OSAC_ENABLE_FULFILLMENT_TRUST_RECONCILER
            value: {{ .Values.global.fulfillmentTrust.enabled | default false | quote }}
          - name: OSAC_FULFILLMENT_TRUST_TENANT_NAMESPACE
            value: {{ .Values.global.fulfillmentTrust.tenantNamespace | quote }}
          - name: OSAC_ENABLE_COMPUTE_INSTANCE_CONTROLLER
            value: {{ include "osac-operator.controllerEnabled" (list . "computeInstance" "vmaas") | quote }}
          - name: OSAC_ENABLE_TENANT_CONTROLLER
            value: {{ .Values.controllers.tenant | quote }}
          - name: OSAC_ENABLE_NETWORKING_CONTROLLER
            value: {{ .Values.controllers.networking | quote }}
          - name: OSAC_ENABLE_BAREMETAL_INSTANCE_CONTROLLER
            value: {{ include "osac-operator.controllerEnabled" (list . "bareMetalInstance" "bmaas") | quote }}
          - name: OSAC_ENABLE_STORAGE_CONTROLLER
            value: {{ .Values.controllers.storage | quote }}
          - name: OSAC_ENABLE_VOLUME_CONTROLLER
            value: {{ .Values.controllers.volume | quote }}
          - name: OSAC_ENABLE_NETWORKING_PROVISIONING
            value: {{ .Values.controllers.networkingProvisioning | default false | quote }}
{{- if .Values.vendorControllers }}
{{- $pairs := list }}
{{- range $k, $v := .Values.vendorControllers }}
{{- $pairs = append $pairs (printf "%s=%s" $k $v) }}
{{- end }}
          - name: OSAC_VENDOR_CONTROLLERS
            value: {{ join "," $pairs | quote }}
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
            {{- if $debugEnabled }}
            add:
            - SYS_PTRACE
            {{- end }}
        {{- if not $debugEnabled }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- end }}
        resources:
          {{- if $debugEnabled }}
          {{- toYaml $debugResources | nindent 10 }}
          {{- else }}
          {{- toYaml .Values.resources | nindent 10 }}
          {{- end }}
        volumeMounts:
          - name: fulfillment-ca-bundle
            mountPath: /etc/ca-bundle
            readOnly: true
          {{- if $debugEnabled }}
          - name: debug-tmp
            mountPath: /tmp
          {{- end }}
      volumes:
        - name: fulfillment-ca-bundle
          configMap:
            name: {{ .Values.fulfillment.tls.caBundle.configMap | required "fulfillment.tls.caBundle.configMap is required" }}
            items:
              - key: {{ .Values.fulfillment.tls.caBundle.key | required "fulfillment.tls.caBundle.key is required" }}
                path: bundle.pem
        {{- if $debugEnabled }}
        - name: debug-tmp
          emptyDir: {}
        {{- end }}
      serviceAccountName: {{ include "osac-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
