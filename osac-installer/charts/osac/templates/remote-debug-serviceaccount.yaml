{{- $operatorValues := index .Values "operator" | default dict -}}
{{- $operatorDebugValues := index $operatorValues "debug" | default dict -}}
{{- $serviceValues := index .Values "service" | default dict -}}
{{- $serviceDebugValues := index $serviceValues "debug" | default dict -}}
{{- $operatorDebug := index $operatorDebugValues "enabled" | default false -}}
{{- $fulfillmentDebug := index $serviceDebugValues "enabled" | default false -}}
{{- if and $fulfillmentDebug (not $operatorDebug) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
{{- end }}
