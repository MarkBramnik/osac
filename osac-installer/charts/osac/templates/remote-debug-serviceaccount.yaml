{{- $serviceValues := index .Values "service" | default dict -}}
{{- $serviceDebugValues := index $serviceValues "debug" | default dict -}}
{{- $fulfillmentDebug := index $serviceDebugValues "enabled" | default false -}}
{{- if $fulfillmentDebug }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fulfillment-debug
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
